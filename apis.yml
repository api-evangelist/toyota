description: Toyota Motor Corporation is a Japanese multinational automotive manufacturer
  that designs, manufactures, and sells vehicles, including cars, trucks, and buses.
  Founded in 1937, Toyota has become one of the largest automakers in the world, known
  for its reliability, innovation, and commitment to sustainability. Toyota's developer
  platform (developer.eig.toyota.com) provides APIs for vehicle lifecycle management,
  telematics and connected services, dealer data, and fleet management for business
  partners, dealers, fleet operators, and developers building mobility applications.
  Toyota's product lineup includes hybrids like the Prius, trucks like the Tacoma,
  and EVs including the bZ4X.
